# Bean Validation message keys.
# Referenced from DTOs as message = "{validation.NotBlank}".
# Hibernate Validator picks this file up automatically from the classpath root.

validation.NotBlank=This field is required
validation.NotNull=This field is required
validation.NotEmpty=This field must not be empty
validation.Size=Length must be between {min} and {max} characters
validation.Email=Must be a valid email address
validation.Pattern=Format is invalid
validation.Min=Must be at least {value}
validation.Max=Must not be greater than {value}
validation.Positive=Must be greater than zero
validation.PositiveOrZero=Must be zero or greater
validation.Past=Must be a date in the past
validation.Future=Must be a date in the future